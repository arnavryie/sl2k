name: 🔥 Auto Streak

on:
  schedule:
    - cron: "47 2 * * *"   # Daily at 02:47 UTC — feels organic
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  streak:
    name: Daily Commit Engine
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: pip install requests

      - name: 🔧 Configure Git Identity
        run: |
          git config user.name "streak-bot[bot]"
          git config user.email "streak-bot@users.noreply.github.com"

      - name: ⏱️ Random Delay (feels human)
        run: |
          DELAY=$((RANDOM % 180))
          echo "Sleeping ${DELAY}s before committing..."
          sleep $DELAY

      - name: 🎲 Decide Commit Count (1–3)
        id: commit_count
        run: |
          COUNT=$((RANDOM % 3 + 1))
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Will make $COUNT commit(s) today."

      - name: 🚀 Run Streak Generator
        env:
          COMMIT_COUNT: ${{ steps.commit_count.outputs.count }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate.py

      - name: 📊 Commit & Push Changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping."
            exit 0
          fi
          COMMIT_MSG=$(cat /tmp/commit_msg.txt 2>/dev/null || echo "chore: daily activity update")
          git commit -m "$COMMIT_MSG"
          git pull --rebase origin main
          git push origin main
          echo "✅ Pushed successfully."

      - name: 📈 Summary
        if: always()
        run: |
          echo "## 🔥 Streak Updated" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date -u '+%Y-%m-%d') |" >> $GITHUB_STEP_SUMMARY
          echo "| Commits this run | ${{ steps.commit_count.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY
